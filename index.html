<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Atrasos - Colégio</title>
  <!-- Vínculo com o arquivo CSS externo -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h2>Registro de Atraso Escolar</h2>
    
    <form id="formAtraso">
      <div class="form-group">
        <label for="nome">Nome do Aluno(a):</label>
        <input type="text" id="nome" required placeholder="Digite o nome completo">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="turma">Turma:</label>
          <input type="text" id="turma" required placeholder="Ex: 8º Ano A">
        </div>

        <div class="form-group">
          <label for="pedagoga">Pedagoga Responsável:</label>
          <input type="text" id="pedagoga" required placeholder="Nome da pedagoga">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="data">Data:</label>
          <input type="date" id="data" required>
        </div>

        <div class="form-group">
          <label for="hora">Hora:</label>
          <input type="time" id="hora" required>
        </div>
      </div>

      <div class="form-group">
        <label for="motivo">Motivo do Atraso:</label>
        <textarea id="motivo" required placeholder="Descreva o motivo do atraso..."></textarea>
      </div>

      <button type="submit" id="btnSalvar">Registrar Atraso</button>
    </form>

    <div id="mensagem"></div>
  </div>
  <div class="form-group">
  <label for="email">E-mail do Aluno (@escola):</label>
  <input type="email" id="email" required placeholder="aluno@escola.com.br">
  </div>
  <!-- Vínculo com o arquivo JavaScript externo -->
  <script src="script.js"></script>
</body>
</html>
